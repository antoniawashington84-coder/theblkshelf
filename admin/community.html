<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Community – Mate Masie</title>

  <link rel="stylesheet" href="css/mate-masie.css">
</head>

<body>
  <div class="mm-layout">
    <div id="mateMasieSidebar"></div>

    <main class="mm-main">
      <div id="mateMasieTopbar"></div>

      <section class="mm-content">
        <span class="mm-eyebrow">Readers & Events</span>

<h1 class="mm-page-title">Community</h1>

<p class="mm-page-subtitle">
  Manage reader activity, author accounts, events, newsletter tools, and community links.
</p>

<div class="mm-card">
  <h2>Coming next</h2>
  <p class="mm-muted">
    This will become the community and events workspace.
  </p>
</div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    async function initPage() {
      await loadMateMasieShell("community");

      const auth = await requireAdmin();
      if (!auth) return;

      setTopbarUser(auth.user, auth.profile);
    }

    initPage();
  </script>
</body>
</html>
