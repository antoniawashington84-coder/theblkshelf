<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Review Book – Mate Masie</title>

  <link rel="stylesheet" href="css/mate-masie.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    .content-column {
      max-width: 1100px;
      margin: 0 auto;
    }

    .submission-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1rem;
      align-items: start;
      margin-top: 1rem;
    }

    .cover-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.25);
    }

    .status-pill {
      display: inline-block;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.8rem;
    }

    .status-pill.pending { background: rgba(111,83,36,.75); color: #f5d89d; }
    .status-pill.approved { background: rgba(53,86,61,.75); color: #c8f2ce; }
    .status-pill.needs-info { background: rgba(36,69,111,.75); color: #b7d8ff; }
    .status-pill.denied { background: rgba(107,48,44,.75); color: #ffd1cb; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
    }

    .detail-field {
      padding: 0.9rem;
      border-radius: 16px;
      background: rgba(23,16,12,0.65);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .detail-label {
      display: block;
      color: var(--soft);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .detail-value {
      color: var(--text);
      word-break: break-word;
    }

    .section-card {
      margin-top: 1rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag {
      display: inline-block;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      background: rgba(230,176,106,0.12);
      border: 1px solid rgba(230,176,106,0.25);
      color: var(--accent-light);
      font-size: 0.85rem;
    }

    .compact-review {
  grid-template-columns: 280px 1fr;
}

.review-sidebar {
  display: grid;
  gap: 1rem;
}

.review-sidebar .section-card {
  margin-top: 0;
}

.compact-grid {
  grid-template-columns: repeat(3, 1fr);
}

.compact-description {
  max-height: 190px;
  overflow-y: auto;
  padding-right: 0.4rem;
}

.review-action-stack {
  display: grid;
  gap: 0.65rem;
  margin-top: 1rem;
}

.review-accordion {
  background: linear-gradient(180deg, var(--panel), var(--panel-2));
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 18px;
  overflow: hidden;
}

.review-accordion summary {
  cursor: pointer;
  padding: 1rem;
  color: var(--accent-light);
  font-weight: bold;
}

.accordion-body {
  padding: 0 1rem 1rem;
}

.admin-notes {
  width: 100%;
  min-height: 130px;
  resize: vertical;
  padding: 0.85rem;
  border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.22);
  background: rgba(23,16,12,0.92);
  color: var(--text);
  font: inherit;
}

.mm-btn.approve-btn {
  background: #2f6b3f;
  color: #fff8f0;
  border-color: rgba(200,242,206,0.35);
}

.mm-btn.needs-info-btn {
  background: #24456f;
  color: #fff8f0;
  border-color: rgba(183,216,255,0.35);
}

.mm-btn.deny-btn {
  background: #6b302c;
  color: #fff8f0;
  border-color: rgba(255,209,203,0.35);
}

@media (max-width: 900px) {
  .compact-review {
    grid-template-columns: 1fr;
  }

  .compact-grid {
    grid-template-columns: 1fr;
  }
}

    @media (max-width: 850px) {
      .submission-layout {
        grid-template-columns: 1fr;
      }

      .cover-card {
        max-width: 260px;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="mm-layout">
    <div id="mateMasieSidebar"></div>

    <main class="mm-main">
      <div id="mateMasieTopbar"></div>

      <section class="mm-content">
        <div class="content-column">
          <span class="mm-eyebrow">Book Review</span>
          <h1 class="mm-page-title" id="pageTitle">Book Submission</h1>
          <p class="mm-page-subtitle">
  Review this book submission before approving, denying, or requesting changes.
</p>

          <div class="mm-btn-row">
  <button class="mm-btn mm-btn-secondary" id="prevSubmissionBtn" type="button">← Previous</button>
  <a class="mm-btn mm-btn-secondary" href="review-queue.html">← Back to Review Queue</a>
  <button class="mm-btn mm-btn-secondary" id="nextSubmissionBtn" type="button">Next →</button>
</div>

          <div id="submissionContent">
            <div class="mm-card">
              <p class="mm-muted">Loading submission...</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>

  <script>
    const STORAGE_BASE =
  "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public";

let currentBookSubmission = null;
let linkedAuthor = null;
let linkedAuthorReviewUrl = "";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function normalizeStatus(value) {
      const status = String(value || "pending").toLowerCase().trim();
      if (status === "needs_info") return "needs-info";
      if (status === "approved") return "approved";
      if (status === "denied") return "denied";
      return "pending";
    }

    function displayStatus(value) {
      const status = String(value || "pending").toLowerCase().trim();
      if (status === "needs_info") return "Needs Info";
      if (status === "approved") return "Approved";
      if (status === "denied") return "Denied";
      return "Pending Review";
    }

    function generateId(prefix) {
  const now = new Date();

  const stamp =
    now.getFullYear().toString() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0") +
    String(now.getSeconds()).padStart(2, "0");

  const random =
    Math.random()
      .toString(36)
      .substring(2, 6)
      .toUpperCase();

  return `${prefix}${stamp}${random}`;
}

    function normalizeDriveImageUrl(url) {
  if (!url) return "";

  const value = String(url).trim();

  const fileMatch = value.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w900`;
  }

  const idMatch = value.match(/[?&]id=([^&]+)/);
  if (idMatch && idMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w900`;
  }

  return value;
}

function getCoverUrl(item) {
  if (item.cover_path) {
    return `${STORAGE_BASE}/book-submissions/${encodeURIComponent(item.cover_path)}`;
  }

  if (item.legacy_cover_url) {
    return normalizeDriveImageUrl(item.legacy_cover_url);
  }

  return "";
}

function normalizeDriveImageUrl(url) {
  if (!url) return "";

  const value = String(url).trim();

  const fileMatch = value.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w700`;
  }

  const idMatch = value.match(/[?&]id=([^&]+)/);
  if (idMatch && idMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w700`;
  }

  return value;
}

function getAuthorImageUrl(item) {
  if (item.author_photo_path) {
    return `${STORAGE_BASE}/author-submissions/${encodeURIComponent(item.author_photo_path)}`;
  }

  if (item.legacy_headshot_url) {
    return normalizeDriveImageUrl(item.legacy_headshot_url);
  }

  if (item.author_image_path) {
    return `${STORAGE_BASE}/authors/${encodeURIComponent(item.author_image_path)}`;
  }

  return "";
}

    function field(label, value) {
      return `
        <div class="detail-field">
          <span class="detail-label">${escapeHtml(label)}</span>
          <div class="detail-value">${value ? escapeHtml(value) : "—"}</div>
        </div>
      `;
    }

    function normalizeList(values) {
  if (Array.isArray(values)) {
    return values
      .map(value => String(value || "").trim())
      .filter(Boolean);
  }

  if (values && typeof values === "object") {
    return Object.values(values)
      .map(value => String(value || "").trim())
      .filter(Boolean);
  }

  const text = String(values || "").trim();

  if (!text) {
    return [];
  }

  try {
    const parsed = JSON.parse(text);

    if (Array.isArray(parsed)) {
      return parsed
        .map(value => String(value || "").trim())
        .filter(Boolean);
    }
  } catch (error) {
    // Legacy rows may contain comma-separated text.
  }

  return text
    .split(/\s*[,;|]\s*/)
    .map(value => value.trim())
    .filter(Boolean);
}

function tags(values) {
  const list = normalizeList(values);

  if (!list.length) {
    return `<p class="mm-muted">None listed.</p>`;
  }

  return `
    <div class="tag-row">
      ${list
        .map(value => `
          <span class="tag">
            ${escapeHtml(value)}
          </span>
        `)
        .join("")}
    </div>
  `;
}

    function normalizeObject(value) {
  if (!value) {
    return {};
  }

  if (
    typeof value === "object" &&
    !Array.isArray(value)
  ) {
    return value;
  }

  try {
    const parsed = JSON.parse(value);

    return (
      parsed &&
      typeof parsed === "object" &&
      !Array.isArray(parsed)
    )
      ? parsed
      : {};
  } catch (error) {
    return {};
  }
}

function linkList(links) {
  const normalizedLinks =
    normalizeObject(links);

  const entries =
    Object.entries(normalizedLinks)
      .filter(([_, value]) =>
        String(value || "").trim()
      );

  if (!entries.length) {
    return `
      <p class="mm-muted">
        No retailer links listed.
      </p>
    `;
  }

  return `
    <div class="detail-grid">
      ${entries
        .map(([key, value]) => `
          <div class="detail-field">
            <span class="detail-label">
              ${escapeHtml(
                key.replaceAll("_", " ")
              )}
            </span>

            <a
              class="detail-value"
              href="${escapeHtml(value)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(value)}
            </a>
          </div>
        `)
        .join("")}
    </div>
  `;
}

    async function setupSubmissionNavigation(currentId) {
  const prevBtn = document.getElementById("prevSubmissionBtn");
  const nextBtn = document.getElementById("nextSubmissionBtn");

  const { data, error } = await supabaseClient
    .from("book_submissions")
    .select("id, created_at")
    .in("submission_status", ["pending", "needs_info"])
    .order("created_at", { ascending: false });

  if (error || !data?.length) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }

  const currentIndex = data.findIndex(item => item.id === currentId);

  const prevItem = currentIndex > 0 ? data[currentIndex - 1] : null;
  const nextItem = currentIndex >= 0 && currentIndex < data.length - 1
    ? data[currentIndex + 1]
    : null;

  prevBtn.disabled = !prevItem;
  nextBtn.disabled = !nextItem;

  if (prevItem) {
    prevBtn.onclick = () => {
      window.location.href = `review-book.html?id=${encodeURIComponent(prevItem.id)}`;
    };
  }

  if (nextItem) {
    nextBtn.onclick = () => {
      window.location.href = `review-book.html?id=${encodeURIComponent(nextItem.id)}`;
    };
  }
}

    async function initSubmissionPage() {
      await loadMateMasieShell("review-queue");

      const target =
  document.getElementById(
    "submissionContent"
  );

const params =
  new URLSearchParams(
    window.location.search
  );

const id =
  params.get("id");

if (!id) {
        target.innerHTML = `<div class="mm-card"><h2>Missing submission ID</h2></div>`;
        return;
      }

      const auth = await requireAdmin();
if (!auth) return;

setTopbarUser(auth.user, auth.profile);

      const { data: book, error: bookError } = await supabaseClient
  .from("book_submissions")
  .select("*")
  .eq("id", id)
  .limit(1);

      if (bookError || !book?.length) {
        target.innerHTML = `
          <div class="mm-card">
            <h2>Submission not found</h2>
            <p class="mm-muted">${escapeHtml(bookError?.message || "This submission could not be loaded.")}</p>
          </div>
        `;
        return;
      }

      const item = book[0];

currentBookSubmission = item;
linkedAuthor = null;
linkedAuthorReviewUrl = "";

await setupSubmissionNavigation(item.id);
      const statusClass = normalizeStatus(item.submission_status);
      const coverUrl = getCoverUrl(item);

      let authorImageUrl = "";

if (item.author_id) {
  const cleanAuthorId =
    String(item.author_id).trim();

  const {
    data: authorMatch,
    error: authorError
  } = await supabaseClient
    .from("authors")
    .select(`
  AUTHOR_ID,
  SUBMISSION_ID,
  AUTHOR_NAME,
  EMAIL_ADDRESS,
  AUTHORIMAGEPATH,
  APPROVAL
`)
    .ilike(
      "AUTHOR_ID",
      cleanAuthorId
    )
    .limit(1)
    .maybeSingle();

  if (authorError) {
    console.error(
      "Unable to load linked author:",
      authorError
    );
  }

  linkedAuthor =
    authorMatch || null;

  if (linkedAuthor?.AUTHORIMAGEPATH) {
    authorImageUrl =
      `${STORAGE_BASE}/authors/` +
      encodeURIComponent(
        linkedAuthor.AUTHORIMAGEPATH
      );
  }

  const approvalStatus =
  String(
    linkedAuthor?.APPROVAL || ""
  )
    .trim()
    .toLowerCase();

if (
  approvalStatus === "approved" &&
  linkedAuthor?.AUTHOR_ID
) {
  linkedAuthorReviewUrl =
    `admin-author.html?id=${encodeURIComponent(
      linkedAuthor.AUTHOR_ID
    )}`;

} else if (
  linkedAuthor?.AUTHOR_ID
) {
  const linkedAuthorId =
    String(
      linkedAuthor.AUTHOR_ID
    ).trim();

  let authorSubmission = null;

  /*
   * First use the permanent author relationship.
   * Do not filter by status because legacy rows may
   * have a status that does not match the author table.
   */
  const {
    data: authorIdMatches,
    error: authorIdError
  } = await supabaseClient
    .from("author_submissions")
    .select(`
      id,
      submission_id,
      submission_status,
      submitted_at,
      created_at
    `)
    .eq(
      "approved_author_id",
      linkedAuthorId
    )
    .order(
      "submitted_at",
      {
        ascending: false,
        nullsFirst: false
      }
    )
    .limit(10);

  if (authorIdError) {
    console.error(
      "Unable to find author review by Author ID:",
      authorIdError
    );
  }

  if (authorIdMatches?.length) {
    authorSubmission =
      authorIdMatches.find(row =>
        ["pending", "needs_info"].includes(
          String(
            row.submission_status || ""
          )
            .trim()
            .toLowerCase()
        )
      ) ||
      authorIdMatches.find(row =>
        String(
          row.submission_status || ""
        )
          .trim()
          .toLowerCase() !==
        "archived_duplicate"
      ) ||
      authorIdMatches[0];
  }

  /*
   * Legacy fallback using the original submission ID.
   */
  if (
    !authorSubmission &&
    linkedAuthor?.SUBMISSION_ID
  ) {
    const {
      data: submissionMatches,
      error: submissionError
    } = await supabaseClient
      .from("author_submissions")
      .select(`
        id,
        submission_id,
        submission_status,
        submitted_at,
        created_at
      `)
      .eq(
        "submission_id",
        String(
          linkedAuthor.SUBMISSION_ID
        ).trim()
      )
      .order(
        "submitted_at",
        {
          ascending: false,
          nullsFirst: false
        }
      )
      .limit(10);

    if (submissionError) {
      console.error(
        "Unable to find author review by Submission ID:",
        submissionError
      );
    }

    if (submissionMatches?.length) {
      authorSubmission =
        submissionMatches.find(row =>
          ["pending", "needs_info"].includes(
            String(
              row.submission_status || ""
            )
              .trim()
              .toLowerCase()
          )
        ) ||
        submissionMatches.find(row =>
          String(
            row.submission_status || ""
          )
            .trim()
            .toLowerCase() !==
          "archived_duplicate"
        ) ||
        submissionMatches[0];
    }
  }

  if (authorSubmission?.id) {
    linkedAuthorReviewUrl =
      `review-author.html?id=${encodeURIComponent(
        authorSubmission.id
      )}`;
  }
}
}

const hasLinkedAuthor =
  Boolean(
    linkedAuthor?.AUTHOR_ID
  );

const authorApprovalStatus =
  String(
    linkedAuthor?.APPROVAL || ""
  )
    .trim()
    .toLowerCase();

const authorIsApproved =
  hasLinkedAuthor &&
  authorApprovalStatus ===
    "approved";

let authorWarningHtml = "";

if (authorIsApproved) {
  authorWarningHtml = `
    <div
      style="
        margin-bottom:1rem;
        padding:.85rem 1rem;
        border-radius:14px;
        background:rgba(53,86,61,.3);
        border:1px solid rgba(123,188,138,.3);
        color:#c8f2ce;
      "
    >
      Linked to approved author:
      <strong>
        ${escapeHtml(
          linkedAuthor.AUTHOR_NAME
        )}
      </strong>

      <span
        style="
          display:block;
          margin-top:.25rem;
          font-size:.88rem;
        "
      >
        Author ID:
        ${escapeHtml(
          linkedAuthor.AUTHOR_ID
        )}
      </span>
    </div>
  `;

} else if (hasLinkedAuthor) {
  authorWarningHtml = `
    <div
      style="
        margin-bottom:1rem;
        padding:.85rem 1rem;
        border-radius:14px;
        background:rgba(111,83,36,.35);
        border:1px solid rgba(245,216,157,.3);
        color:#f5d89d;
      "
    >
      Connected to author:
      <strong>
        ${escapeHtml(
          linkedAuthor.AUTHOR_NAME
        )}
      </strong>

      <span
        style="
          display:block;
          margin-top:.25rem;
          font-size:.88rem;
        "
      >
        Author ID:
        ${escapeHtml(
          linkedAuthor.AUTHOR_ID
        )}
      </span>

      <span
        style="
          display:block;
          margin-top:.25rem;
        "
      >
        This author profile is still pending approval.
        Approve the author before publishing this book.
      </span>
    </div>
  `;

} else {
  authorWarningHtml = `
    <div
      style="
        margin-bottom:1rem;
        padding:.85rem 1rem;
        border-radius:14px;
        background:rgba(107,48,44,.35);
        border:1px solid rgba(255,209,203,.3);
        color:#ffd1cb;
      "
    >
      This book is not connected to an author profile.
      Link or approve the author before publishing this book.
    </div>
  `;
}

      document.getElementById("pageTitle").textContent = item.title || "Book Submission";

      target.innerHTML = `
  ${authorWarningHtml}

  <div class="submission-layout compact-review">
    <aside class="review-sidebar">
      <div class="mm-card cover-card">

  ${
    coverUrl
      ? `<img
           src="${escapeHtml(coverUrl)}"
           alt="${escapeHtml(item.title)} cover"
           onerror="this.outerHTML='<div class=&quot;mm-muted&quot;>Cover unavailable</div>'"
         >`
      : `<div class="mm-muted">No cover</div>`
  }

  <div
    style="
      display:flex;
      align-items:center;
      gap:.75rem;
      margin-top:1rem;
      padding-top:1rem;
      border-top:1px solid rgba(255,255,255,.12);
    "
  >

    ${
      authorImageUrl
        ? `<img
             src="${escapeHtml(authorImageUrl)}"
             alt="${escapeHtml(item.author_name)}"
             style="
               width:64px;
               height:64px;
               border-radius:50%;
               object-fit:cover;
               border:2px solid rgba(255,255,255,.18);
             "
           >`
        : `<div
             style="
               width:64px;
               height:64px;
               border-radius:50%;
               background:rgba(255,255,255,.08);
               display:flex;
               align-items:center;
               justify-content:center;
               font-size:1.5rem;
             ">
             <i class="fa-solid fa-user"></i>
           </div>`
    }

    <div style="min-width:0;">
      <div
        style="
          color:var(--soft);
          font-size:.72rem;
          letter-spacing:.08em;
          text-transform:uppercase;
        "
      >
        Author
      </div>

      <div
  style="
    font-weight:600;
    color:var(--text);
  "
>
  ${escapeHtml(
    linkedAuthor?.AUTHOR_NAME ||
    item.author_name ||
    "Unknown Author"
  )}
</div>

${
  linkedAuthorReviewUrl
    ? `
      <a
        class="mm-btn mm-btn-secondary"
        href="${escapeHtml(
          linkedAuthorReviewUrl
        )}"
        style="
          display:inline-block;
          margin-top:.55rem;
          padding:.45rem .7rem;
          font-size:.82rem;
        "
      >
        <i class="fa-solid fa-user-check"></i>
        Review Author
      </a>
    `
    : `
      <span
        class="mm-muted"
        style="
          display:block;
          margin-top:.45rem;

    async function saveBookStatus(id, status) {
  const note = document.getElementById("actionNote");
  const adminNotes = document.getElementById("adminNotes").value;

  note.textContent = "Saving...";

  const { error } = await supabaseClient
    .from("book_submissions")
    .update({
      submission_status: status,
      admin_notes: adminNotes,
      reviewed_at: new Date().toISOString()
    })
    .eq("id", id);

  if (error) {
    console.error(error);
    note.textContent = error.message || "Unable to update status.";
    return;
  }

  note.textContent = `Saved as ${status}. Refreshing...`;

setTimeout(() => {
  window.location.reload();
}, 600);
}

async function moveBookCoverToLive(
  item,
  bookId
) {
  if (!item.cover_path) {
    return null;
  }

  const pendingPath =
    String(item.cover_path).trim();

  const extension =
    pendingPath.includes(".")
      ? pendingPath
          .split(".")
          .pop()
          .toLowerCase()
      : "jpg";

  const livePath =
    `${bookId}.${extension}`;

  const {
    data: coverBlob,
    error: downloadError
  } = await supabaseClient.storage
    .from("book-submissions")
    .download(pendingPath);

  if (downloadError) {
    throw downloadError;
  }

  const {
    error: uploadError
  } = await supabaseClient.storage
    .from("covers")
    .upload(
      livePath,
      coverBlob,
      {
        cacheControl: "3600",
        upsert: true,
        contentType:
          coverBlob.type ||
          "image/jpeg"
      }
    );

  if (uploadError) {
    throw uploadError;
  }

  return {
    pendingPath,
    livePath
  };
}

function arrayToText(value) {
  if (Array.isArray(value)) {
    return value
      .map(item =>
        String(item || "").trim()
      )
      .filter(Boolean)
      .join(", ");
  }

  return String(value || "").trim();
}

function buildLiveBookPayload(
  item,
  bookId,
  coverPath
) {
  const retailerLinks =
    item.retailer_links || {};

  const audio =
    item.audio || {};

  const kids =
    item.kids || {};

  return {
    "Timestamp":
      item.submitted_at ||
      item.created_at ||
      new Date().toISOString(),

    "SUBMISSION_ID":
      item.submission_id,

    "Book_ID":
      bookId,

    "Author_ID":
      item.author_id,

    "Author_Name":
      linkedAuthor?.AUTHOR_NAME ||
      item.author_name,

    "Email_Address":
      item.email ||
      linkedAuthor?.EMAIL_ADDRESS ||
      "",

    "Title":
      item.title,

    "Description":
      item.description || "",

    "Release/Expected_Release_Date":
      item.release_date || null,

    "Genre":
      item.primary_genre || "",

    "Sub_Genres":
      arrayToText(
        item.sub_genres
      ),

    "Vibes":
      arrayToText(
        item.vibes
      ),

    "Spice_Level":
      item.spice_level || "",

    "Age_Range":
      item.age_range || "",

    "Representation":
      arrayToText(
        item.representation
      ),

    "Available_Formats":
      arrayToText(
        item.available_formats
      ),

    "Website_Link":
      retailerLinks.website || "",

    "Amazon_Link":
      retailerLinks.amazon || "",

    "BN_Link":
      retailerLinks.barnes_noble || "",

    "Bookfunnel_Link":
      retailerLinks.bookfunnel || "",

    "Kobo_Link":
      retailerLinks.kobo || "",

    "Apple_Books_Link":
      retailerLinks.apple_books || "",

    "Other_Link":
      retailerLinks.other || "",

    "Word_Count":
      item.word_count || null,

    "Page_Count":
      item.page_count || null,

    "Has_Audiobook":
      Boolean(
        audio.has_audiobook
      ),

    "Audiobook_Narrators":
      audio.narrators || "",

    "Audiobook_Link":
      audio.link || "",

    "Kids_Category":
      kids.category || "",

    "Contributors":
      Array.isArray(
        item.co_authors
      )
        ? item.co_authors
        : [],

    "Series_Name":
      item.series_name || "",

    "Series_Number":
      item.series_number || null,

    "Book_Cover":
      item.legacy_cover_url || "",

    "CoverImagePath":
      coverPath || null,

    "CoverImageStatus":
      coverPath
        ? "Complete"
        : "",

    "CoverImageLastUpdated":
      coverPath
        ? new Date().toISOString()
        : null,

    "CoverImageError":
      "",

    "Author_Status":
      "Approved",

    "Book_Approval":
      "Approved",

    "Is_Live":
      "Yes",

    "admin_notes":
      document
        .getElementById(
          "adminNotes"
        )
        .value,

    "Last_Updated":
      new Date().toISOString()
  };
}

async function approveBookSubmission(id) {
  if (!currentBookSubmission) {
    return;
  }

  if (
    !linkedAuthor ||
    String(
      linkedAuthor.APPROVAL || ""
    )
      .trim()
      .toLowerCase() !==
      "approved"
  ) {
    alert(
      "This book must be connected to an approved author before it can be approved."
    );

    return;
  }

  if (
    !currentBookSubmission.author_id
  ) {
    alert(
      "This submission is missing its Author ID."
    );

    return;
  }

  if (
    !confirm(
      "Approve this book and publish it to the live library?"
    )
  ) {
    return;
  }

  const note =
    document.getElementById(
      "actionNote"
    );

    const approveButton =
  document.querySelector(
    ".approve-btn"
  );

if (approveButton) {
  approveButton.disabled = true;
  approveButton.textContent =
    "Approving...";
}

  const adminNotes =
    document.getElementById(
      "adminNotes"
    ).value;

  let coverMove = null;

  try {
    note.textContent =
      "Checking for an existing book...";

    const {
      data: existingBooks,
      error: existingError
    } = await supabaseClient
      .from("books")
      .select(`
        id,
        Book_ID,
        CoverImagePath
      `)
      .eq(
        "SUBMISSION_ID",
        currentBookSubmission
          .submission_id
      )
      .limit(1);

    if (existingError) {
      throw existingError;
    }

    const existingBook =
      existingBooks?.[0] || null;

    const bookId =
      existingBook?.Book_ID ||
      currentBookSubmission
        .approved_book_id ||
      generateId("BLKB");

    let liveCoverPath =
      existingBook?.CoverImagePath ||
      null;

    if (
      currentBookSubmission.cover_path
    ) {
      note.textContent =
        "Moving cover to the live library...";

      coverMove =
        await moveBookCoverToLive(
          currentBookSubmission,
          bookId
        );

      liveCoverPath =
        coverMove.livePath;
    }

    note.textContent =
      "Creating live book record...";

    const payload =
      buildLiveBookPayload(
        currentBookSubmission,
        bookId,
        liveCoverPath
      );

    if (existingBook) {
      const {
        error: updateError
      } = await supabaseClient
        .from("books")
        .update(payload)
        .eq(
          "id",
          existingBook.id
        );

      if (updateError) {
        throw updateError;
      }

    } else {
      const {
        error: insertError
      } = await supabaseClient
        .from("books")
        .insert(payload);

      if (insertError) {
        throw insertError;
      }
    }

    note.textContent =
      "Updating submission status...";

    const {
      error: submissionError
    } = await supabaseClient
      .from("book_submissions")
      .update({
        submission_status:
          "approved",

        admin_notes:
          adminNotes,

        reviewed_at:
          new Date().toISOString(),

        approved_book_id:
          bookId
      })
      .eq(
        "id",
        id
      );

    if (submissionError) {
      throw submissionError;
    }

    if (coverMove?.pendingPath) {
      const {
        error: cleanupError
      } = await supabaseClient.storage
        .from("book-submissions")
        .remove([
          coverMove.pendingPath
        ]);

      if (cleanupError) {
        console.warn(
          "Book approved, but pending cover cleanup failed:",
          cleanupError
        );
      }
    }

    note.textContent =
      `Book approved and published as ${bookId}.`;

    setTimeout(() => {
      window.location.href =
        "review-queue.html";
    }, 900);

  } catch (error) {
    console.error(error);

    note.textContent =
      error.message ||
      "Unable to approve and publish this book.";

      if (approveButton) {
  approveButton.disabled = false;
  approveButton.textContent =
    "Approve";

  }
}
  
}

  </script>
