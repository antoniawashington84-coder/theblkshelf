<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Books Manager – Mate Masie</title>

  <link rel="stylesheet" href="../admin/css/mate-masie.css">

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .content-column {
  max-width: 1100px;
  margin: 0 auto;
}

    .bookshelf-header {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 1rem;
  flex-wrap: wrap;
}

.books-manager-controls {
  display: grid;
  grid-template-columns: 1fr 180px 180px;
  gap: 0.75rem;
  margin-top: 1.25rem;
}

.books-manager-search,
.books-manager-select {
  width: 100%;
  padding: 0.95rem 1rem;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.22);
  background: rgba(23,16,12,0.92);
  color: var(--text);
  font: inherit;
}

.books-manager-search:focus,
.books-manager-select:focus {
  outline: 3px solid var(--accent-light);
  border-color: var(--accent-light);
}

@media (max-width: 760px) {
  .books-manager-controls {
    grid-template-columns: 1fr;
  }
}

.author-select-title {
  display: inline-block;
  width: auto;
  max-width: 100%;
  padding: 0.35rem 0.6rem;
  border-radius: 12px;
  border: 1px solid rgba(230,176,106,0.35);
  background: rgba(23,16,12,0.75);
  color: var(--accent-light);
  font: inherit;
  font-size: inherit;
  font-weight: bold;
}

    .bookshelf {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%),
    linear-gradient(180deg, #2a1d14 0%, #1d140f 100%);
  border: 10px solid #2b1d13;
  border-radius: 14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 24px 70px rgba(0,0,0,0.45);
  padding: 0.5rem 0;
  overflow: hidden;
  margin: 1.5rem auto 0;
  width: calc((145px * 5) + (0.8rem * 4) + 2rem + 20px);
  max-width: 100%;
}

.shelf-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: 0.8rem;
  padding: 2rem 1rem 1.1rem;
  min-height: 285px;
  flex-wrap: nowrap;
  width: 100%;
}

.shelf-row::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 20px;
  background: linear-gradient(180deg, #7b5230 0%, #5e3b21 45%, #3f2716 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.08), inset 0 -6px 10px rgba(0,0,0,0.35), 0 -8px 20px rgba(0,0,0,0.28);
  z-index: 1;
}

.shelf-row > * {
  position: relative;
  z-index: 2;
}

.portal-book {
  width: 145px;
  flex: 0 0 145px;
}

.portal-book-card {
  background: linear-gradient(180deg, rgba(29,23,19,0.98), rgba(20,15,12,0.98));
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

.portal-cover-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  background: rgba(255,255,255,0.04);
  overflow: hidden;
}

.portal-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.portal-book-info {
  display: none;
}

.portal-status-ribbon {
  position: absolute;
  top: 0.45rem;
  left: 0.45rem;
  z-index: 3;
  padding: 0.25rem 0.45rem;
  border-radius: 999px;
  font-size: 0.55rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(18,14,11,0.78);
  border: 1px solid rgba(230,176,106,0.35);
}

.portal-status-ribbon.pending { color: #f5d89d; }
.portal-status-ribbon.approved { color: #c8f2ce; }
.portal-status-ribbon.needs-info { color: #b7d8ff; }
.portal-status-ribbon.denied { color: #ffd1cb; }

.portal-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0.65rem;
  background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.35), transparent);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.portal-book:hover .portal-overlay {
  opacity: 1;
  transform: translateY(0);
}

.portal-overlay-title {
  font-size: 0.78rem;
  font-weight: bold;
  line-height: 1.2;
}

.portal-overlay-meta {
  font-size: 0.68rem;
  color: rgba(255,248,240,0.75);
}

.status-pill {
  display: inline-block;
  padding: 0.28rem 0.45rem;
  border-radius: 7px;
  font-size: 0.58rem;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.status-pill.pending {
  background: rgba(111,83,36,.75);
  color: #f5d89d;
}

.status-pill.approved {
  background: rgba(53,86,61,.75);
  color: #c8f2ce;
}

.status-pill.needs-info {
  background: rgba(36,69,111,.75);
  color: #b7d8ff;
}

.status-pill.denied {
  background: rgba(107,48,44,.75);
  color: #ffd1cb;
}

.book-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid rgba(255,255,255,0.12);
}

.book-action {
  padding: 0.5rem;
  text-align: center;
  color: var(--text);
  text-decoration: none;
  border-right: 1px solid rgba(255,255,255,0.12);
  font-size: 0.95rem;
}

.book-action:last-child {
  border-right: none;
}

.book-action:hover {
  background: rgba(230,176,106,0.12);
  color: var(--accent-light);
}

@media (max-width: 760px) {
  .shelf-row {
    gap: 0.45rem;
    padding: 1.2rem 0.5rem 0.85rem;
    min-height: 185px;
  }

  .portal-book {
    width: 82px;
    flex-basis: 82px;
  }

  .portal-book-info {
    display: none;
  }

  .book-action {
    font-size: 0.8rem;
    padding: 0.4rem;
  }

  .bookshelf {
  width: calc((82px * 5) + (0.45rem * 4) + 1rem + 20px);
}
  
}

html {
  overscroll-behavior: none;
}

body {
  overscroll-behavior: none;
}

.mm-main {
  overscroll-behavior: contain;
}

  </style>
</head>

<body>
  <div class="mm-layout">
    <div id="mateMasieSidebar"></div>

    <main class="mm-main">
      <div id="mateMasieTopbar"></div>

      <section class="mm-content">
        <div class="content-column">
          <div class="bookshelf-header">
  <div>
    <span class="mm-eyebrow">Admin Library</span>

<h1 class="mm-page-title">
  <span id="bookshelfTitle">Authors Manager</span>
</h1>

<p class="mm-page-subtitle">
  Manage live author profiles.
</p>
  </div>

  <a class="mm-btn" href="review-queue.html">
  Review Queue
</a>
</div>

<div class="books-manager-controls">
  <input
    class="books-manager-search"
    id="bookSearch"
    type="search"
    placeholder="Search by title, author, genre, or series..."
  >

  <select class="books-manager-select" id="genreFilter">
    <option value="all">All genres</option>
  </select>

  <select class="books-manager-select" id="sortBooks">
    <option value="newest">Newest first</option>
    <option value="az">Title A–Z</option>
    <option value="za">Title Z–A</option>
    <option value="author">Author A–Z</option>
  </select>
</div>

          <div id="booksContent" class="bookshelf">
            <div class="mm-card">
              <p class="mm-muted">Loading your books...</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>

  <script>

    let allBooks = [];
let currentShelfPage = 1;
const BOOKS_PER_PAGE = 100;

const STORAGE_BASE = "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public";
const DEFAULT_COVER = `${STORAGE_BASE}/defaults/cover-default.jpg`;

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function normalizeDriveImageUrl(url) {
  if (!url) return "";

  const value = String(url).trim();

  const fileMatch = value.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w700`;
  }

  const idMatch = value.match(/[?&]id=([^&]+)/);
  if (idMatch && idMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w700`;
  }

  return value;
}

function getBookTitle(book) {
  return book.Title || book.title || "Untitled";
}

function getBookAuthor(book) {
  return book.Author_Name || book.author_name || "Unknown Author";
}

function getBookGenre(book) {
  return book.Genre || book.primary_genre || "";
}

function getBookId(book) {
  return book.Book_ID || book.id;
}

function getBookCover(book) {
  if (book.CoverImagePath) {
    return `${STORAGE_BASE}/covers/${encodeURIComponent(book.CoverImagePath)}`;
  }

  if (book.cover_path) {
    return `${STORAGE_BASE}/book-submissions/${encodeURIComponent(book.cover_path)}`;
  }

  if (book.legacy_cover_url) {
    return normalizeDriveImageUrl(book.legacy_cover_url);
  }

  return DEFAULT_COVER;
}

function isBookLive(book) {
  const value = String(book.Is_Live ?? book.is_live ?? "").toLowerCase();
  return value === "yes" || value === "true" || value === "live";
}

function chunkBooks(items, size = 5) {
  const chunks = [];

  for (let i = 0; i < items.length; i += size) {
    chunks.push(items.slice(i, i + size));
  }

  return chunks;
}

function normalizeSearch(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshteinDistance(a, b) {
  const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);

  for (let j = 0; j <= a.length; j++) {
    matrix[0][j] = j;
  }

  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      matrix[i][j] =
        b.charAt(i - 1) === a.charAt(j - 1)
          ? matrix[i - 1][j - 1]
          : Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
    }
  }

  return matrix[b.length][a.length];
}

function fuzzyScore(query, text) {
  const cleanQuery = normalizeSearch(query);
  const cleanText = normalizeSearch(text);

  if (!cleanQuery) return 9999;
  if (cleanText.includes(cleanQuery)) return 0;

  const queryWords = cleanQuery.split(" ").filter(Boolean);
  const textWords = cleanText.split(" ").filter(Boolean);

  let score = 0;

  queryWords.forEach(queryWord => {
    let bestWordScore = 999;

    textWords.forEach(textWord => {
      if (textWord.includes(queryWord) || queryWord.includes(textWord)) {
        bestWordScore = Math.min(bestWordScore, 1);
      } else {
        bestWordScore = Math.min(
          bestWordScore,
          levenshteinDistance(queryWord, textWord)
        );
      }
    });

    score += bestWordScore;
  });

  return score;
}

function isFuzzyMatch(query, text) {
  const cleanQuery = normalizeSearch(query);
  if (!cleanQuery) return true;

  const score = fuzzyScore(cleanQuery, text);
  const tolerance = Math.max(2, Math.floor(cleanQuery.length * 0.25));

  return score <= tolerance;
}

function populateGenreFilter() {
  const genreSelect = document.getElementById("genreFilter");
  if (!genreSelect) return;

  const genres = [...new Set(
    allBooks
      .map(book => getBookGenre(book))
      .filter(Boolean)
  )].sort();

  genreSelect.innerHTML = `
    <option value="all">All genres</option>
    ${genres.map(genre => `
      <option value="${escapeHtml(genre)}">${escapeHtml(genre)}</option>
    `).join("")}
  `;
}

function getFilteredBooks() {
  const searchValue = normalizeSearch(document.getElementById("bookSearch")?.value);
  const genreValue = document.getElementById("genreFilter")?.value || "all";
  const sortValue = document.getElementById("sortBooks")?.value || "newest";

  let books = [...allBooks];

  if (searchValue) {
  books = books
    .map(book => {
      const text = [
        getBookTitle(book),
        getBookAuthor(book),
        getBookGenre(book),
        book.Series_Name || book.series_name || ""
      ].join(" ");

      return {
        book,
        score: fuzzyScore(searchValue, text)
      };
    })
    .filter(item => {
      const tolerance = Math.max(2, Math.floor(searchValue.length * 0.25));
      return item.score <= tolerance || normalizeSearch([
        getBookTitle(item.book),
        getBookAuthor(item.book),
        getBookGenre(item.book),
        item.book.Series_Name || item.book.series_name || ""
      ].join(" ")).includes(searchValue);
    })
    .sort((a, b) => a.score - b.score)
    .map(item => item.book);
}

  if (genreValue !== "all") {
    books = books.filter(book => getBookGenre(book) === genreValue);
  }

  books.sort((a, b) => {
    if (sortValue === "az") {
      return getBookTitle(a).localeCompare(getBookTitle(b));
    }

    if (sortValue === "za") {
      return getBookTitle(b).localeCompare(getBookTitle(a));
    }

    if (sortValue === "author") {
      return getBookAuthor(a).localeCompare(getBookAuthor(b));
    }

    return 0;
  });

  return books;
}

function renderBookshelf() {
  const target = document.getElementById("booksContent");
  const filteredBooks = getFilteredBooks();
const totalPages = Math.max(1, Math.ceil(filteredBooks.length / BOOKS_PER_PAGE));

if (currentShelfPage > totalPages) {
  currentShelfPage = totalPages;
}

const start = (currentShelfPage - 1) * BOOKS_PER_PAGE;
const end = start + BOOKS_PER_PAGE;
const visibleBooks = filteredBooks.slice(start, end);

  if (!visibleBooks.length) {
    target.innerHTML = `
      <div class="mm-card">
        <h2>No books found</h2>
        <p class="mm-muted">No live catalog records were found.</p>
      </div>
    `;
    return;
  }

  const rows = chunkBooks(visibleBooks, 5);

  target.innerHTML = `
  ${rows.map(row => `
    <div class="shelf-row">
      ${row.map(book => {
        const id = getBookId(book);
const title = getBookTitle(book);
const author = getBookAuthor(book);
const authorId = book.Author_ID || book.author_id || "";
const genre = getBookGenre(book);
        const coverUrl = getBookCover(book);
        const initial = title.charAt(0).toUpperCase() || "B";

        return `
          <article class="portal-book">
            <div class="portal-book-card">
              <div class="portal-cover-wrap">
                <span class="portal-status-ribbon approved">
  Live
</span>

                <img
                  class="portal-cover"
                  src="${escapeHtml(coverUrl)}"
                  alt="${escapeHtml(title)} cover"
                  onerror="this.closest('.portal-cover-wrap').innerHTML='${escapeHtml(initial)}'"
                >

                <div class="portal-overlay">
                  <div class="portal-overlay-title">${escapeHtml(title)}</div>
                  <div class="portal-overlay-meta">${escapeHtml(author)}</div>
                  <div class="portal-overlay-meta">${escapeHtml(genre || "No genre listed")}</div>
                </div>
              </div>

              <div class="book-actions">
  <a class="book-action" title="Book Details" href="admin-book.html?id=${encodeURIComponent(id)}">
    <i class="fa-solid fa-circle-info"></i>
  </a>

  <a class="book-action" title="Edit Book" href="admin-book-edit.html?id=${encodeURIComponent(id)}">
    <i class="fa-solid fa-pen"></i>
  </a>

  <a
  class="book-action"
  title="View Author"
  href="admin-author.html?id=${encodeURIComponent(authorId)}"
>
  <i class="fa-solid fa-user"></i>
</a>
</div>
            </div>
          </article>
        `;
      }).join("")}
    </div>
    `).join("")}

  <div class="mm-btn-row" style="justify-content:center; padding:1.25rem;">
    <button class="mm-btn mm-btn-secondary" id="prevShelfBtn" type="button" ${currentShelfPage <= 1 ? "disabled" : ""}>
      ← Previous Shelf
    </button>

    <span class="mm-muted" style="align-self:center;">
      Shelf ${currentShelfPage} of ${totalPages}
    </span>

    <button class="mm-btn mm-btn-secondary" id="nextShelfBtn" type="button" ${currentShelfPage >= totalPages ? "disabled" : ""}>
      Next Shelf →
    </button>
  </div>
`;

document.getElementById("prevShelfBtn")?.addEventListener("click", () => {
  currentShelfPage -= 1;
  renderBookshelf();
});

document.getElementById("nextShelfBtn")?.addEventListener("click", () => {
  currentShelfPage += 1;
  renderBookshelf();
});
}

async function initAdminBooks() {
  await loadMateMasieShell("authors");

  const auth = await requireAdmin();
  if (!auth) return;

  setTopbarUser(auth.user, auth.profile);

setupBookControls();

const target = document.getElementById("booksContent");

  let books = [];
let from = 0;
const batchSize = 1000;

while (true) {
  const { data, error } = await supabaseClient
    .from("books")
    .select("*")
    .eq("Is_Live", "Yes")
    .order("Timestamp", { ascending: false })
    .range(from, from + batchSize - 1);

  if (error) {
    target.innerHTML = `
      <div class="mm-card">
        <h2>Unable to load books</h2>
        <p class="mm-muted">${escapeHtml(error.message)}</p>
      </div>
    `;
    return;
  }

  books = books.concat(data || []);

  if (!data || data.length < batchSize) break;

  from += batchSize;
}

    allBooks = books || [];
populateGenreFilter();
renderBookshelf();
}

function setupBookControls() {
  document.getElementById("bookSearch")?.addEventListener("input", () => {
  currentShelfPage = 1;
  renderBookshelf();
});

document.getElementById("genreFilter")?.addEventListener("change", () => {
  currentShelfPage = 1;
  renderBookshelf();
});

document.getElementById("sortBooks")?.addEventListener("change", () => {
  currentShelfPage = 1;
  renderBookshelf();
});
}

initAdminBooks();
  </script>
</body>
</html>
