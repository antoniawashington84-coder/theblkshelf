<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Event – The BLK Shelf</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link rel="stylesheet" href="includes/shared.css">

  <style>
    :root {
      --bg: #0f0c0a;
      --text: #fff8f0;
      --muted: #e3d2c0;
      --soft: #c9b7a5;
      --accent: #d8a35d;
      --line: rgba(255,255,255,0.18);
      --panel: #241d17;
      --panel-dark: #17100c;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      line-height: 1.6;
      background:
        linear-gradient(rgba(15, 12, 10, 0.55), rgba(15, 12, 10, 0.55)),
        url("https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/logo/bckgrnd.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      padding: 2rem 0;
      border-bottom: 1px solid var(--line);
    }

    .page {
      padding: 2.5rem 0 4rem;
    }

    .event-card {
      background: linear-gradient(180deg, #3f2e23, #241d17);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .event-hero {
      position: relative;
      min-height: 360px;
      display: flex;
      align-items: flex-end;
      padding: 2rem;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.15), rgba(15,12,10,0.92)),
        var(--panel-dark);
      overflow: hidden;
    }

    .event-hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.75;
    }

    .event-hero-content {
      position: relative;
      z-index: 1;
      max-width: 820px;
    }

    .eyebrow {
      display: inline-block;
      padding: 0.42rem 0.88rem;
      border: 1px solid rgba(216,163,93,0.24);
      border-radius: 999px;
      background: rgba(216,163,93,0.12);
      color: #f2cb98;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 4.6rem);
      line-height: 0.96;
      margin: 0.9rem 0 0.9rem;
      letter-spacing: -0.03em;
    }

    .event-summary {
      color: var(--muted);
      max-width: 58rem;
      font-size: 1.08rem;
      margin: 0;
    }

    .event-body {
      padding: 2rem;
      display: grid;
      grid-template-columns: 1.4fr 0.75fr;
      gap: 1.5rem;
    }

    .event-main,
    .event-side {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-panel {
      padding: 1.2rem;
      border-radius: 22px;
      background: rgba(15,12,10,0.45);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .info-panel h2,
    .info-panel h3 {
      color: #f2c994;
      margin: 0 0 0.8rem;
    }

    .info-panel p {
      color: var(--muted);
      margin: 0.35rem 0;
    }

    .detail-list {
      display: grid;
      gap: 0.75rem;
    }

    .detail-item {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 0.75rem;
      color: var(--muted);
    }

    .detail-item i {
      color: var(--accent);
      margin-top: 0.25rem;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      background: rgba(216,163,93,0.08);
      border: 1px solid rgba(216,163,93,0.22);
      color: var(--muted);
      font-size: 0.86rem;
    }

    .cta-grid {
      display: grid;
      gap: 0.7rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border: none;
      cursor: pointer;
      padding: 0.75rem 1rem;
      background: #d8a35d;
      color: #120e0b;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      transition: 0.2s ease;
      font-family: inherit;
      text-align: center;
    }

    .btn:hover {
      background: #e6b06a;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: rgba(216,163,93,0.08);
      border: 1px solid rgba(216,163,93,0.28);
      color: #f2c994;
    }

    .btn.secondary:hover {
      background: rgba(216,163,93,0.14);
    }

    .loading-state,
    .empty-state {
      color: var(--soft);
      padding: 2rem;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 2rem 0 2.2rem;
      color: var(--soft);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .event-body {
        grid-template-columns: 1fr;
      }

      .event-hero {
        min-height: 320px;
      }
    }

    @media (max-width: 600px) {
      body {
        background:
          linear-gradient(rgba(15, 12, 10, 0.55), rgba(15, 12, 10, 0.55)),
          url("https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/logo/bckgrnd-mobile.png");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        background-attachment: scroll;
      }

      header {
        padding: 1.3rem 0 1.7rem;
      }

      .event-hero {
        min-height: 300px;
        padding: 1.2rem;
      }

      .event-body {
        padding: 1.1rem;
      }

      h1 {
        font-size: 2.35rem;
      }
    }
  </style>
</head>

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function formatDateRange(event) {
  const options = { month: "long", day: "numeric", year: "numeric" };
  const start = new Date(event.start_date + "T00:00:00").toLocaleDateString("en-US", options);

  if (!event.end_date || event.end_date === event.start_date) return start;

  const end = new Date(event.end_date + "T00:00:00").toLocaleDateString("en-US", options);
  return `${start} – ${end}`;
}

function formatTimeRange(event) {
  if (!event.start_time) return "Time TBA";

  const start = formatTime(event.start_time);
  const end = event.end_time ? formatTime(event.end_time) : "";

  return `${start}${end ? " – " + end : ""}${event.timezone ? " " + event.timezone : ""}`;
}

function formatTime(value) {
  const [hour, minute] = value.split(":");
  const date = new Date();
  date.setHours(Number(hour), Number(minute || 0));
  return date.toLocaleTimeString("en-US", {
    hour: "numeric",
    minute: "2-digit"
  });
}

function renderPills(items) {
  if (!items || !items.length) return "";
  return `
    <div class="pill-row">
      ${items.map(item => `<span class="pill">${escapeHtml(item)}</span>`).join("")}
    </div>
  `;
}

function getLocationText(event) {
  if (event.event_format === "Virtual") return "Virtual Event";

  const parts = [
    event.venue_name,
    event.street_address,
    [event.city, event.state, event.zip_code].filter(Boolean).join(", "),
    event.country
  ].filter(Boolean);

  return parts.join("<br>");
}

function renderEvent(event) {
  document.title = `${event.event_name} – The BLK Shelf`;

  const image = event.event_image_url || event.flyer_image_url || "";
  const imageAlt = event.event_image_alt || event.event_name;

  document.getElementById("eventDetail").innerHTML = `
    <section class="event-hero">
      ${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(imageAlt)}">` : ""}
      <div class="event-hero-content">
        <span class="eyebrow">${escapeHtml(event.event_format || "Event")}</span>
        <h1>${escapeHtml(event.event_name)}</h1>
        <p class="event-summary">${escapeHtml(event.description)}</p>
        ${renderPills(event.event_types || [event.event_type])}
      </div>
    </section>

    <section class="event-body">
      <div class="event-main">
        <div class="info-panel">
          <h2>About This Event</h2>
          <p>${escapeHtml(event.description)}</p>
        </div>

        ${event.featured_authors ? `
          <div class="info-panel">
            <h2>Featured Authors</h2>
            <p>${escapeHtml(event.featured_authors)}</p>
          </div>
        ` : ""}

        <div class="info-panel">
          <h2>Discoverability</h2>
          ${renderPills([...(event.audiences || []), ...(event.genres || []), ...(event.event_focus || [])])}
        </div>

        ${event.vendor_available ? `
          <div class="info-panel">
            <h2>Vendor Opportunities</h2>
            <p><strong>Vendor Fee:</strong> ${escapeHtml(event.vendor_fee || "Not listed")}</p>
            <p><strong>Vendor Deadline:</strong> ${escapeHtml(event.vendor_deadline || "Not listed")}</p>
            ${event.vendor_application_link ? `<p><a class="btn secondary" href="${escapeHtml(event.vendor_application_link)}" target="_blank" rel="noopener">Apply as Vendor</a></p>` : ""}
          </div>
        ` : ""}
      </div>

      <aside class="event-side">
        <div class="info-panel">
          <h3>Event Details</h3>
          <div class="detail-list">
            <div class="detail-item">
              <i class="fa-regular fa-calendar"></i>
              <div>${escapeHtml(formatDateRange(event))}</div>
            </div>

            <div class="detail-item">
              <i class="fa-regular fa-clock"></i>
              <div>${escapeHtml(formatTimeRange(event))}</div>
            </div>

            <div class="detail-item">
              <i class="fa-solid fa-location-dot"></i>
              <div>${getLocationText(event)}</div>
            </div>

            <div class="detail-item">
              <i class="fa-solid fa-ticket"></i>
              <div>${escapeHtml(event.free_event ? "Free Event" : event.ticket_price || "Price TBA")}</div>
            </div>
          </div>
        </div>

        <div class="info-panel">
          <h3>Take Action</h3>
          <div class="cta-grid">
            ${event.registration_link ? `<a class="btn" href="${escapeHtml(event.registration_link)}" target="_blank" rel="noopener">Register / Get Tickets</a>` : ""}
            ${event.event_website ? `<a class="btn secondary" href="${escapeHtml(event.event_website)}" target="_blank" rel="noopener">Visit Event Website</a>` : ""}
            <a class="btn secondary" href="events.html">Back to Events</a>
          </div>
        </div>
      </aside>
    </section>
  `;
}

async function fetchEvent() {
  const slug = getParam("slug") || "black-romance-book-fest";
  return TEST_EVENTS.find(event => event.slug === slug);
}

async function loadEventPage() {
  const event = await fetchEvent();

  if (!event) {
    document.getElementById("eventDetail").innerHTML =
      `<div class="empty-state">Event not found.</div>`;
    return;
  }

  renderEvent(event);
}

async function loadIncludes() {
  const header = await fetch("includes/header.html");
  document.getElementById("site-header").innerHTML = await header.text();

  const footer = await fetch("includes/footer.html");
  document.getElementById("site-footer").innerHTML = await footer.text();
}

loadIncludes();
loadEventPage();
