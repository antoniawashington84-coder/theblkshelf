<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Set Password – The BLK Shelf</title>

  <link
    rel="stylesheet"
    href="../includes/shared.css"
  >

  <style>
    :root {
      --bg: #0f0c0a;
      --panel: #3f2e23;
      --panel-2: #241d17;
      --text: #fff8f0;
      --muted: #e3d2c0;
      --soft: #c9b7a5;
      --accent: #e6b06a;
      --line: rgba(255,255,255,0.18);
      --radius: 22px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      background:
        linear-gradient(
          rgba(15,12,10,0.72),
          rgba(15,12,10,0.72)
        ),
        url(
          "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/logo/bckgrnd.png"
        );

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
    }

    .admin-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .admin-card {
      width: 100%;
      max-width: 430px;
      padding: 2rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);

      background:
        linear-gradient(
          180deg,
          var(--panel),
          var(--panel-2)
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,0.45);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid rgba(230,176,106,0.3);
      border-radius: 999px;
      background: rgba(230,176,106,0.1);
      color: #f2c994;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: 2rem;
      line-height: 1.05;
    }

    p {
      margin: 0 0 1.4rem;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 0.9rem 0 0.35rem;
      color: var(--soft);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 0.95rem;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      background: #17100c;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 3px solid #f2c994;
      border-color: #f2c994;
    }

    button {
      width: 100%;
      margin-top: 1.3rem;
      padding: 0.95rem 1.2rem;
      border: 2px solid #120e0b;
      border-radius: 14px;
      background: var(--accent);
      color: #120e0b;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #f2c994;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .note {
      min-height: 1.4em;
      margin-top: 1rem;
      color: var(--soft);
      font-size: 0.9rem;
    }

    .note.error {
      color: #e7b0a2;
    }

    .note.success {
      color: #f2c994;
    }

    .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: #f2c994;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="admin-wrap">
    <section class="admin-card">
      <span class="eyebrow">
        Account Setup
      </span>

      <h1>Create Your Password</h1>

      <p>
        Set a password to finish activating your BLK Shelf account.
      </p>

      <form id="setPasswordForm">
        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <button
          id="setPasswordButton"
          type="submit"
        >
          Set Password
        </button>
      </form>

      <div
        id="passwordNote"
        class="note"
        aria-live="polite"
      ></div>

      <a
        class="back-link"
        href="login.html"
      >
        ← Back to login
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://njgprucvnayyiooiftaw.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Im5qZ3BydWN2bmF5eWlvb2lmdGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDg0ODMsImV4cCI6MjA5MzMyNDQ4M30.1r6r8vyYB0PnrZtugcBz3CPuCP9MMlTTMYXfewEINNw";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const form =
      document.getElementById(
        "setPasswordForm"
      );

    const note =
      document.getElementById(
        "passwordNote"
      );

    const button =
      document.getElementById(
        "setPasswordButton"
      );

    function showMessage(
      message,
      type = ""
    ) {
      note.textContent =
        message;

      note.className =
        `note ${type}`.trim();
    }

    async function verifyInviteSession() {
      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();

      if (error) {
        throw error;
      }

      if (!data.session) {
        throw new Error(
          "This invitation link is invalid or has expired. Ask an administrator to send a new invitation."
        );
      }

      showMessage(
        "Invitation verified. Create your password below.",
        "success"
      );
    }

    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const password =
          document.getElementById(
            "newPassword"
          ).value;

        const confirmation =
          document.getElementById(
            "confirmPassword"
          ).value;

        showMessage("");

        if (
          password.length < 8
        ) {
          showMessage(
            "Your password must contain at least 8 characters.",
            "error"
          );

          return;
        }

        if (
          password !== confirmation
        ) {
          showMessage(
            "The passwords do not match.",
            "error"
          );

          return;
        }

        button.disabled = true;
        button.textContent =
          "Saving Password...";

        try {
          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password
              });

          if (error) {
            throw error;
          }

          showMessage(
            "Password created. Redirecting to login...",
            "success"
          );

          await supabaseClient.auth
            .signOut();

          window.setTimeout(
            () => {
              window.location.href =
                "login.html";
            },
            900
          );

        } catch (error) {
          console.error(error);

          showMessage(
            error.message ||
            "Unable to set your password.",
            "error"
          );

          button.disabled = false;
          button.textContent =
            "Set Password";
        }
      }
    );

    verifyInviteSession()
      .catch(error => {
        console.error(error);

        showMessage(
          error.message ||
          "Unable to verify this invitation.",
          "error"
        );

        button.disabled = true;
      });
  </script>
</body>
</html>
