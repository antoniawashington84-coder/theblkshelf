<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Queue – Mate Masie</title>
  <link rel="stylesheet" href="css/mate-masie.css">

  <style>
    .queue-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .queue-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .queue-tab {
      padding: 0.8rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(36,29,23,0.86);
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }

    .queue-tab.active,
    .queue-tab:hover {
      background: rgba(230,176,106,0.12);
      border-color: rgba(230,176,106,0.42);
      color: var(--accent-light);
    }

    .queue-tools {
      margin-bottom: 1.2rem;
    }

    .queue-search {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(23,16,12,0.92);
      color: var(--text);
      font: inherit;
    }

    .queue-search:focus {
      outline: 3px solid var(--accent-light);
      border-color: var(--accent-light);
    }

    .queue-list {
      display: grid;
      gap: 1rem;
    }

    .queue-card {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      gap: 1rem;
      align-items: center;
    }

    .queue-thumb {
      width: 92px;
      aspect-ratio: 2 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.14);
      display: grid;
      place-items: center;
      color: var(--accent-light);
      font-size: 2rem;
    }

    .queue-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .queue-card h3 {
      margin: 0 0 0.3rem;
      font-size: 1.35rem;
    }

    .queue-meta {
      color: var(--soft);
      font-size: 0.92rem;
      margin: 0.25rem 0;
    }

    .queue-label {
      display: inline-block;
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      background: rgba(230,176,106,0.12);
      color: var(--accent-light);
      border: 1px solid rgba(230,176,106,0.28);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    .queue-placeholder {
  background: linear-gradient(180deg, rgba(230,176,106,0.16), rgba(36,29,23,0.95));
  color: var(--accent-light);
  font-weight: bold;
  text-align: center;
}

.queue-controls {
  display: grid;
  grid-template-columns: 1fr 190px 190px;
  gap: 0.75rem;
}

.queue-select {
  width: 100%;
  padding: 0.95rem 1rem;
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.22);
  background: rgba(23,16,12,0.92);
  color: var(--text);
  font: inherit;
}

.queue-select:focus {
  outline: 3px solid var(--accent-light);
  border-color: var(--accent-light);
}

.queue-action {
  display: grid;
  gap: 0.65rem;
  justify-items: stretch;
}

.review-status-pill {
  display: inline-block;
  text-align: center;
  padding: 0.45rem 0.7rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: bold;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 1px solid rgba(255,255,255,0.16);
}

.review-status-pill.pending {
  background: rgba(111, 83, 36, 0.55);
  color: #f5d89d;
}

.review-status-pill.needs-info {
  background: rgba(36, 69, 111, 0.55);
  color: #b7d8ff;
}

.review-status-pill.approved {
  background: rgba(53, 86, 61, 0.65);
  color: #c8f2ce;
}

.review-status-pill.denied {
  background: rgba(107, 48, 44, 0.65);
  color: #ffd1cb;
}

.review-status-pill.unknown {
  background: rgba(255,255,255,0.08);
  color: var(--muted);
}

@media (max-width: 800px) {
  .queue-controls {
    grid-template-columns: 1fr;
  }
}

    @media (max-width: 800px) {
      .queue-summary {
        grid-template-columns: 1fr;
      }

      .queue-card {
        grid-template-columns: 72px 1fr;
      }

      .queue-action {
        grid-column: 1 / -1;
      }

      .queue-thumb {
        width: 72px;
      }
    }
  </style>
</head>

<body>
  <div class="mm-layout">
    <div id="mateMasieSidebar"></div>

    <main class="mm-main">
      <div id="mateMasieTopbar"></div>

      <section class="mm-content">
        <span class="mm-eyebrow">Pending Review</span>
        <h1 class="mm-page-title">Review Queue</h1>
        <p class="mm-page-subtitle">
          Treat this like an inbox. Open the submission, review the details, then approve, deny, or request more information.
        </p>

        <div class="queue-summary">
          <article class="mm-card">
            <div class="mm-stat" id="totalPendingCount">—</div>
            <h3>Total Pending</h3>
            <p class="mm-muted">Items waiting for review.</p>
          </article>

          <article class="mm-card">
            <div class="mm-stat" id="authorPendingCount">—</div>
            <h3>Authors</h3>
            <p class="mm-muted">Author profiles awaiting review.</p>
          </article>

          <article class="mm-card">
            <div class="mm-stat" id="bookPendingCount">—</div>
            <h3>Books</h3>
            <p class="mm-muted">Books awaiting review.</p>
          </article>
        </div>

        <div class="queue-tabs">
          <button class="queue-tab active" data-type="authors">Authors</button>
          <button class="queue-tab" data-type="books">Books</button>
        </div>

        <div class="queue-tools queue-controls">
  <input
    class="queue-search"
    id="queueSearch"
    type="search"
    placeholder="Search this queue by name, title, author, or email..."
  >

  <select class="queue-select" id="statusFilter">
    <option value="all">All statuses</option>
    <option value="pending">Pending</option>
    <option value="needs_info">Needs Info</option>
    <option value="denied">Denied</option>
  </select>

  <select class="queue-select" id="sortQueue">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="az">A–Z</option>
    <option value="za">Z–A</option>
    <option value="status">Status</option>
  </select>
</div>

        <div class="queue-list" id="queueList">
          <div class="mm-card">
            <p class="mm-muted">Loading submissions...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    let queueData = {
      authors: [],
      books: []
    };

    let activeType = "authors";

    const DEFAULT_AUTHOR = "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/defaults/author-default.jpg";
    const DEFAULT_COVER = "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public/defaults/cover-default.jpg";
    const SUPABASE_STORAGE_BASE = "https://njgprucvnayyiooiftaw.supabase.co/storage/v1/object/public";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "Unknown date";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Unknown date";

      return date.toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }
    
    function formatAge(value) {
  if (!value) return "Unknown age";

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Unknown age";

  const now = new Date();
  const diffMs = now - date;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if (diffDays <= 0) return "Today";
  if (diffDays === 1) return "Yesterday";
  return `${diffDays} days ago`;
}

function normalizeStatus(value) {
  const status = String(value || "pending").toLowerCase().trim();

  if (status === "needs_info") return "needs-info";
  if (status === "approved") return "approved";
  if (status === "denied") return "denied";
  if (status === "pending" || status === "" || status === "null") return "pending";

  return "unknown";
}

function displayStatus(value) {
  const status = String(value || "pending").toLowerCase().trim();

  if (status === "needs_info") return "Needs Info";
  if (status === "approved") return "Approved";
  if (status === "denied") return "Denied";
  return "Pending Review";
}

    function getAuthorImage(item) {
      if (!item.AUTHORIMAGEPATH) return DEFAULT_AUTHOR;
      return `${SUPABASE_STORAGE_BASE}/authors/${encodeURIComponent(item.AUTHORIMAGEPATH)}`;
    }

    function getBookCover(item) {
      if (!item.CoverImagePath) return DEFAULT_COVER;
      return `${SUPABASE_STORAGE_BASE}/covers/${encodeURIComponent(item.CoverImagePath)}`;
    }

    function normalizeSearch(value) {
      return String(value || "").toLowerCase().trim();
    }

    function getAuthorSubmissionImage(item) {
  if (item.author_photo_path) {
    return `${SUPABASE_STORAGE_BASE}/author-submissions/${encodeURIComponent(item.author_photo_path)}`;
  }

  if (item.legacy_headshot_url) {
    return normalizeDriveImageUrl(item.legacy_headshot_url);
  }

  return "";
}

function normalizeDriveImageUrl(url) {
  if (!url) return "";

  const value = String(url).trim();

  const fileMatch = value.match(/\/file\/d\/([^/]+)/);
  if (fileMatch && fileMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w500`;
  }

  const idMatch = value.match(/[?&]id=([^&]+)/);
  if (idMatch && idMatch[1]) {
    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w500`;
  }

  return value;
}

    async function loadPendingQueue() {
      const target = document.getElementById("queueList");
      const A = DB.authors;
      const B = DB.books;

      target.innerHTML = `
        <div class="mm-card">
          <p class="mm-muted">Loading submissions...</p>
        </div>
      `;

      const [authorsResult, booksResult] = await Promise.all([
        supabaseClient
  .from("author_submissions")
  .select("*")
  .in("submission_status", ["pending", "needs_info"])
  .order("created_at", { ascending: false }),

        supabaseClient
  .from("book_submissions")
  .select("*")
  .in("submission_status", ["pending", "needs_info"])
  .order("created_at", { ascending: false })
      ]);

      if (authorsResult.error || booksResult.error) {
        console.error(authorsResult.error || booksResult.error);
        target.innerHTML = `
          <div class="mm-card">
            <h2>Unable to load queue</h2>
            <p class="mm-muted">${escapeHtml((authorsResult.error || booksResult.error).message)}</p>
          </div>
        `;
        return;
      }

      queueData.authors = (authorsResult.data || []);
      queueData.books = (booksResult.data || []);

      document.getElementById("authorPendingCount").textContent = queueData.authors.length;
      document.getElementById("bookPendingCount").textContent = queueData.books.length;
      document.getElementById("totalPendingCount").textContent = queueData.authors.length + queueData.books.length;

      renderQueue();
    }

    function renderQueue() {
      const target = document.getElementById("queueList");
      const searchValue = normalizeSearch(document.getElementById("queueSearch").value);
const statusFilter = document.getElementById("statusFilter").value;
const sortValue = document.getElementById("sortQueue").value;

      const items = queueData[activeType] || [];

      let filtered = items.filter(item => {
        const text = activeType === "authors"
          ? [
              item.AUTHOR_NAME,
              item.EMAIL_ADDRESS,
              item.GENRES,
              item.WEBSITE
            ].join(" ")
          : [
              item.Title,
              item.Author_Name,
              item.Email_Address,
              item.Genre,
              item.Series_Name
            ].join(" ");

        return normalizeSearch(text).includes(searchValue);
      });

      if (statusFilter !== "all") {
  filtered = filtered.filter(item => {
    const status = activeType === "authors"
      ? item.submission_status
      : item.Book_Approval;

    return normalizeSearch(status) === statusFilter;
  });
}

filtered.sort((a, b) => {
  const getName = item => activeType === "authors"
    ? (item.pen_name || item.author_name || "")
    : (item.Title || "");

  const getDate = item => activeType === "authors"
    ? new Date(item.created_at || 0)
    : new Date(item.Timestamp || 0);

  const getStatus = item => activeType === "authors"
    ? (item.submission_status || "")
    : (item.Book_Approval || "");

  if (sortValue === "oldest") return getDate(a) - getDate(b);
  if (sortValue === "az") return getName(a).localeCompare(getName(b));
  if (sortValue === "za") return getName(b).localeCompare(getName(a));
  if (sortValue === "status") return getStatus(a).localeCompare(getStatus(b));

  return getDate(b) - getDate(a);
});

      if (!filtered.length) {
        target.innerHTML = `
          <div class="mm-card">
            <h2>No ${escapeHtml(activeType)} found</h2>
            <p class="mm-muted">Nothing matches this queue view.</p>
          </div>
        `;
        return;
      }

      if (activeType === "authors") {
        renderAuthorCards(filtered);
      } else {
        renderBookCards(filtered);
      }
    }

    function renderAuthorCards(items) {
  const target = document.getElementById("queueList");

  target.innerHTML = items.map(item => {
    const id = item.id;
    const submissionId = item.submission_id || "No submission ID";
    const name = item.pen_name || item.author_name || "Unnamed Author";
    const email = item.email || "No email listed";
    const genres = item.genres || "No genres listed";
    const submitted = formatDate(item.created_at);
    const age = formatAge(item.created_at);
const statusClass = normalizeStatus(item.submission_status);
const statusLabel = displayStatus(item.submission_status);
    const image = getAuthorSubmissionImage(item);

    return `
      <article class="mm-card queue-card">
        ${
  image
    ? `<div class="queue-thumb">
         <img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" onerror="this.closest('.queue-thumb').innerHTML='${escapeHtml(name.charAt(0).toUpperCase() || "A")}'">
       </div>`
    : `<div class="queue-thumb queue-placeholder">
         ${escapeHtml(name.charAt(0).toUpperCase() || "A")}
       </div>`
}

        <div>
          <span class="queue-label">Author Submission</span>
          <h3>${escapeHtml(name)}</h3>
          <p class="queue-meta">${escapeHtml(genres)}</p>
          <p class="queue-meta">${escapeHtml(email)}</p>
          <p class="queue-meta">Submitted ${escapeHtml(submitted)} • ${escapeHtml(age)}</p>
          <p class="queue-meta">Ref: ${escapeHtml(submissionId)}</p>
        </div>

        <div class="queue-action">
  <span class="review-status-pill ${escapeHtml(statusClass)}">
    ${escapeHtml(statusLabel)}
  </span>

  <a class="mm-btn" href="review-author.html?id=${encodeURIComponent(id)}">
    Review Author
  </a>
</div>
      </article>
    `;
  }).join("");
}

    function renderBookCards(items) {
      const target = document.getElementById("queueList");

      target.innerHTML = items.map(item => {
        const id = item.id;
const title = item.title || "Untitled";
const author = item.author_name || "Unknown Author";
const email = item.email || "";
const genre = item.primary_genre || "";
const submitted = formatDate(item.created_at);
const age = formatAge(item.created_at);
const statusClass = normalizeStatus(item.submission_status);
const statusLabel = displayStatus(item.submission_status);

const cover = item.cover_path
  ? `${SUPABASE_STORAGE_BASE}/book-submissions/${encodeURIComponent(item.cover_path)}`
  : item.legacy_cover_url
    ? normalizeDriveImageUrl(item.legacy_cover_url)
    : DEFAULT_COVER;

        return `
          <article class="mm-card queue-card">
            <div class="queue-thumb">
              <img src="${escapeHtml(cover)}" alt="${escapeHtml(title)} cover" onerror="this.onerror=null;this.src='${DEFAULT_COVER}'">
            </div>

            <div>
              <span class="queue-label">Book Submission</span>
              <h3>${escapeHtml(title)}</h3>
              <p class="queue-meta">${escapeHtml(author)} • ${escapeHtml(genre)}</p>
              <p class="queue-meta">${escapeHtml(email)}</p>
              <p class="queue-meta">Submitted ${escapeHtml(submitted)} • ${escapeHtml(age)}</p>
            </div>

            <div class="queue-action">
  <span class="review-status-pill ${escapeHtml(statusClass)}">
    ${escapeHtml(statusLabel)}
  </span>

  <a class="mm-btn" href="review-book.html?id=${encodeURIComponent(id)}">
    Review Book
  </a>
</div>
          </article>
        `;
      }).join("");
    }

    function setupQueueControls() {
      document.querySelectorAll(".queue-tab").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".queue-tab").forEach(tab => tab.classList.remove("active"));
          button.classList.add("active");
          activeType = button.dataset.type;
          document.getElementById("queueSearch").value = "";
          renderQueue();
        });
      });

      document.getElementById("queueSearch").addEventListener("input", renderQueue);
document.getElementById("statusFilter").addEventListener("change", renderQueue);
document.getElementById("sortQueue").addEventListener("change", renderQueue);
    }

    async function initPage() {
      await loadMateMasieShell("review-queue");

      const auth = await requireAdmin();
      if (!auth) return;

      setTopbarUser(auth.user, auth.profile);

      setupQueueControls();
      loadPendingQueue();
    }

    initPage();
  </script>
</body>
</html>
